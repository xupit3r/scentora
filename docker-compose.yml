version: '3.8'

services:
  couchdb:
    image: couchdb:3.3
    container_name: scentora-couchdb
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
    volumes:
      - couchdb_data:/opt/couchdb/data
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: scentora-postgres
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=scentora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d scentora"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  couchdb_data:
  postgres_data:
