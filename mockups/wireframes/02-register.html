<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Wireframe - Scentora</title>
  <link rel="stylesheet" href="../assets/design-system.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--color-bg-secondary);
    }
    
    .register-container {
      width: 400px;
      background-color: var(--color-bg-primary);
      border: 2px solid var(--color-border-medium);
      border-radius: var(--radius-lg);
      padding: var(--spacing-12);
    }
    
    .logo-placeholder {
      width: 100%;
      height: 60px;
      margin-bottom: var(--spacing-8);
      background-color: var(--color-bg-tertiary);
      border: 2px dashed var(--color-border-medium);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-tertiary);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
      text-transform: uppercase;
    }
    
    .form-group {
      margin-bottom: var(--spacing-4);
    }
    
    .form-label {
      display: block;
      margin-bottom: var(--spacing-2);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
    }
    
    .wireframe-input {
      width: 100%;
      height: 40px;
      background-color: var(--color-bg-secondary);
      border: 2px solid var(--color-border-medium);
      border-radius: var(--radius-md);
      padding: var(--spacing-2) var(--spacing-3);
      color: var(--color-text-tertiary);
      font-size: var(--font-size-sm);
    }
    
    .wireframe-button {
      width: 100%;
      height: 44px;
      background-color: var(--color-accent);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-medium);
      cursor: pointer;
      margin-top: var(--spacing-6);
    }
    
    .info-box {
      background-color: var(--color-bg-tertiary);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-md);
      padding: var(--spacing-3);
      margin-bottom: var(--spacing-6);
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
    }
    
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: var(--spacing-6) 0;
      color: var(--color-text-tertiary);
      font-size: var(--font-size-sm);
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--color-border-light);
    }
    
    .divider::before {
      margin-right: var(--spacing-3);
    }
    
    .divider::after {
      margin-left: var(--spacing-3);
    }
    
    .link {
      color: var(--color-accent);
      text-decoration: none;
      font-size: var(--font-size-sm);
      text-align: center;
      display: block;
    }
    
    .wireframe-note {
      position: fixed;
      top: var(--spacing-4);
      right: var(--spacing-4);
      background-color: var(--color-top-bg);
      color: var(--color-top-text);
      padding: var(--spacing-3);
      border-radius: var(--radius-md);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
      max-width: 250px;
    }
  </style>
</head>
<body>
  <div class="wireframe-note">
    📐 WIREFRAME<br>
    Low-fidelity layout sketch
  </div>
  
  <div class="register-container">
    <div class="logo-placeholder">
      [SCENTORA LOGO]
    </div>
    
    <h1 style="font-size: var(--font-size-2xl); font-weight: var(--font-weight-semibold); margin-bottom: var(--spacing-2);">Create account</h1>
    <p style="color: var(--color-text-secondary); margin-bottom: var(--spacing-8); font-size: var(--font-size-sm);">Join Scentora with your invitation code</p>
    
    <div class="info-box">
      ℹ️ Scentora is invitation-only. You'll need an invitation code to register.
    </div>
    
    <form>
      <div class="form-group">
        <label class="form-label">Invitation Code</label>
        <input type="text" class="wireframe-input" placeholder="Enter your invitation code">
      </div>
      
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="wireframe-input" placeholder="you@example.com">
      </div>
      
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" class="wireframe-input" placeholder="Choose a username">
      </div>
      
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="wireframe-input" placeholder="••••••••">
      </div>
      
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="wireframe-input" placeholder="••••••••">
      </div>
      
      <button type="submit" class="wireframe-button">Create Account</button>
    </form>
    
    <div class="divider">or</div>
    
    <a href="#" class="link">Already have an account? Sign in</a>
  </div>
</body>
</html>
