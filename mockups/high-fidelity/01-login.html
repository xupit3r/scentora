<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Scentora</title>
  <link rel="stylesheet" href="../assets/design-system.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #F7F6F3 0%, #FAFAFA 100%);
      position: relative;
    }
    
    .login-container {
      width: 420px;
      background-color: var(--color-bg-primary);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-lg);
      padding: var(--spacing-12);
      box-shadow: var(--shadow-xl);
    }
    
    .logo {
      text-align: center;
      margin-bottom: var(--spacing-10);
    }
    
    .logo-text {
      font-size: var(--font-size-3xl);
      font-weight: var(--font-weight-semibold);
      color: var(--color-accent);
      letter-spacing: -0.02em;
    }
    
    .logo-tagline {
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: var(--spacing-2);
    }
    
    .welcome-text {
      margin-bottom: var(--spacing-8);
    }
    
    .welcome-title {
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      margin-bottom: var(--spacing-2);
      line-height: var(--line-height-tight);
    }
    
    .welcome-subtitle {
      color: var(--color-text-secondary);
      font-size: var(--font-size-sm);
      line-height: var(--line-height-normal);
    }
    
    .form-group {
      margin-bottom: var(--spacing-5);
    }
    
    .form-label {
      display: block;
      margin-bottom: var(--spacing-2);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
    }
    
    .form-input {
      width: 100%;
      height: 44px;
      background-color: var(--color-bg-primary);
      border: 1px solid var(--color-border-medium);
      border-radius: var(--radius-md);
      padding: 0 var(--spacing-3);
      font-size: var(--font-size-sm);
      font-family: var(--font-family);
      color: var(--color-text-primary);
      transition: all var(--transition-fast);
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-light);
    }
    
    .form-input::placeholder {
      color: var(--color-text-tertiary);
    }
    
    .forgot-password {
      text-align: right;
      margin-top: var(--spacing-2);
    }
    
    .forgot-password a {
      color: var(--color-accent);
      text-decoration: none;
      font-size: var(--font-size-sm);
      transition: color var(--transition-fast);
    }
    
    .forgot-password a:hover {
      color: var(--color-accent-hover);
    }
    
    .submit-btn {
      width: 100%;
      height: 48px;
      background-color: var(--color-accent);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-medium);
      cursor: pointer;
      transition: all var(--transition-fast);
      margin-top: var(--spacing-6);
    }
    
    .submit-btn:hover {
      background-color: var(--color-accent-hover);
      box-shadow: var(--shadow-md);
    }
    
    .submit-btn:active {
      transform: translateY(1px);
    }
    
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: var(--spacing-8) 0;
      color: var(--color-text-tertiary);
      font-size: var(--font-size-sm);
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--color-border-light);
    }
    
    .divider::before {
      margin-right: var(--spacing-3);
    }
    
    .divider::after {
      margin-left: var(--spacing-3);
    }
    
    .register-link {
      text-align: center;
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
    }
    
    .register-link a {
      color: var(--color-accent);
      text-decoration: none;
      font-weight: var(--font-weight-medium);
      transition: color var(--transition-fast);
    }
    
    .register-link a:hover {
      color: var(--color-accent-hover);
    }
    
    .mockup-badge {
      position: fixed;
      top: var(--spacing-4);
      right: var(--spacing-4);
      background-color: var(--color-accent);
      color: white;
      padding: var(--spacing-2) var(--spacing-3);
      border-radius: var(--radius-full);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>
  <div class="mockup-badge">High-Fidelity Mockup</div>
  
  <div class="login-container">
    <div class="logo">
      <div class="logo-text">Scentora</div>
      <div class="logo-tagline">Accord Management</div>
    </div>
    
    <div class="welcome-text">
      <h1 class="welcome-title">Welcome back</h1>
      <p class="welcome-subtitle">Sign in to continue managing your perfume accords</p>
    </div>
    
    <form>
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input 
          type="email" 
          id="email"
          class="form-input" 
          placeholder="you@example.com"
          autocomplete="email"
        >
      </div>
      
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password"
          class="form-input" 
          placeholder="Enter your password"
          autocomplete="current-password"
        >
        <div class="forgot-password">
          <a href="#">Forgot password?</a>
        </div>
      </div>
      
      <button type="submit" class="submit-btn">Sign In</button>
    </form>
    
    <div class="divider">or</div>
    
    <div class="register-link">
      Don't have an account? <a href="#">Create one now</a>
    </div>
  </div>
</body>
</html>
